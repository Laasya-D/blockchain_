<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blockchain Club</title>
<meta name="description" content="A university student organization researching distributed systems, applied cryptography, and offensive & defensive security." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  .selected-event{
  margin-top:16px;
  padding:16px;
  border-left:2px solid var(--accent);
  background:var(--accent-dim);
}

.selected-event-title{
  font-size:16px;
  color:var(--text);
}

.selected-event-meta{
  margin-top:7px;
  color:var(--text-faint);
  font-size:9px;
  letter-spacing:.05em;
}

.selected-event-description{
  margin-top:12px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}
  .calendar-event-dot{
  width:6px;
  height:6px;
  margin-top:10px;
  background:var(--accent);
  border-radius:50%;
}
/* tokens*/
.calendar-details{
  padding:26px 30px;
  border-top:1px solid var(--border);
  background:rgba(255,255,255,.01);
}

.calendar-details h3{
  margin-top:10px;
  font-size:18px;
  font-weight:500;
}

.calendar-details p{
  margin-top:8px;
  color:var(--text-dim);
  font-size:13px;
  line-height:1.6;
}

.calendar-day{
  cursor:pointer;
}

.calendar-day.selected{
  background:var(--accent-dim);
}

.calendar-day.selected .calendar-number{
  color:var(--text);
}
.calendar-events{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.calendar-event{
  padding:5px 7px;
  border-left:2px solid var(--accent);
  background:var(--accent-dim);
  color:var(--text);
  font-family:var(--font-mono);
  font-size:9px;
  line-height:1.4;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
:root{
  --bg:#070707;
  --bg-alt:#0c0c0c;
  --bg-elevated:#111110;
  --text:#f1ece1;
  --text-dim:#8b8a85;
  --text-faint:#4c4b47;
  --border:#1d1d1c;
  --border-light:#2b2b29;
  --accent:#b5051c;
  --accent-bright:#d02b44;
  --accent-dim:#2c1216;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --container:1240px;
  --radius:2px;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-weight:400;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;margin:0;letter-spacing:-0.01em;color:var(--text);}
p{margin:0;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
img{max-width:100%;display:block;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:1.5px solid var(--accent-bright);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;scroll-behavior:auto !important;}
}
.container{max-width:var(--container);margin:0 auto;padding:0 32px;}
.mono{font-family:var(--font-mono);}
.text-dim{color:var(--text-dim);}
.text-faint{color:var(--text-faint);}
.accent{color:var(--accent-bright);}

/*util*/
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--text-dim);display:inline-flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:5px;height:5px;background:var(--accent);display:inline-block;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 26px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  border:1px solid var(--border-light);border-radius:var(--radius);background:transparent;color:var(--text);
  transition:border-color .25s ease, background .25s ease, transform .25s ease, color .25s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#f7ede9;}
.btn-primary:hover{background:var(--accent-bright);border-color:var(--accent-bright);transform:translateY(-1px);}
.btn-outline:hover{border-color:var(--text-dim);transform:translateY(-1px);}
.btn-sm{padding:9px 16px;font-size:10.5px;}
.link-btn{font-size:11px;letter-spacing:.08em;color:var(--text-dim);border:none;background:none;padding:4px 0;border-bottom:1px solid transparent;}
.link-btn:hover{color:var(--text);border-color:var(--text-dim);}
.link-btn.danger:hover{color:var(--accent-bright);border-color:var(--accent-bright);}
.big-num{font-family:var(--font-display);font-weight:300;color:var(--text-faint);line-height:1;}
.divider{border:none;border-top:1px solid var(--border);margin:0;}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;padding:4px 8px;border:1px solid var(--border-light);text-transform:uppercase;color:var(--text-dim);}
.badge.published{color:#c9c4b8;border-color:#3a3a37;}
.badge.draft{color:var(--text-faint);}
.status-dot{width:6px;height:6px;border-radius:50%;background:#7fae86;display:inline-block;box-shadow:0 0 6px #7fae8688;}
.status-badge{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;color:var(--text-dim);}

/*sec*/
.section{padding:100px 0;border-top:1px solid var(--border);}
.section:first-of-type{border-top:none;}
.section-head{display:flex;gap:28px;align-items:flex-start;margin-bottom:56px;}
.section-head .big-num{font-size:56px;min-width:70px;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);text-transform:uppercase;letter-spacing:0.01em;}
.section-head .section-copy{color:var(--text-dim);max-width:440px;margin-top:10px;font-size:15px;}
.section-top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}

/*navig*/
.nav{position:fixed;top:0;left:0;right:0;z-index:200;border-bottom:1px solid var(--border);
  background:rgba(7,7,7,.78);backdrop-filter:blur(10px);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px;}
.nav-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
  flex-shrink: 0;
}

.nav-logo img {
  width: 42px;
  height: 42px;
  object-fit: contain;
  display: block;
}

.brand-name {
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.nav-links{display:flex;gap:34px;}
.nav-link{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);position:relative;padding:4px 0;transition:color .2s;}
.nav-link::after{content:'';position:absolute;left:0;bottom:-3px;width:0;height:1px;background:var(--accent-bright);transition:width .25s ease;}
.nav-link:hover,.nav-link.active{color:var(--text);}
.nav-link:hover::after,.nav-link.active::after{width:100%;}
.nav-toggle{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:8px;}
.nav-toggle span{width:20px;height:1px;background:var(--text);display:block;}
@media (max-width:900px){
  .nav-links{position:fixed;top:72px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--border);
    flex-direction:column;gap:0;max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .nav.nav-open .nav-links{max-height:520px;}
  .nav-links .nav-link{padding:16px 32px;border-top:1px solid var(--border);width:100%;}
  .nav-toggle{display:flex;}
}

.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:110px;overflow:hidden;}
.network-canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.4;pointer-events:none;}
.hero-inner{position:relative;z-index:2;}
.hero-title{font-size:clamp(38px,7.2vw,84px);text-transform:uppercase;line-height:.98;letter-spacing:-0.01em;margin:22px 0 26px;}
.hero-title span{display:block;}
.hero-desc{max-width:520px;color:var(--text-dim);font-size:16px;margin-bottom:36px;}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;}
.ascii-wrap{
  position:relative;
  margin-top:64px;
  height:340px;
}
.ascii-canvas{position:absolute;inset:0;width:100%;height:100%;}
@media (max-width:700px){.ascii-wrap{height:220px;}}

/* section-scroll badge */
.section-badge{position:fixed;left:24px;bottom:24px;z-index:150;display:flex;align-items:baseline;gap:10px;
  font-family:var(--font-mono);border:1px solid var(--border-light);background:rgba(7,7,7,.7);backdrop-filter:blur(6px);
  padding:10px 14px;opacity:.9;}
.section-badge .num{font-size:20px;color:var(--accent-bright);}
.section-badge .lbl{font-size:10px;letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase;}
.section-badge.fade{animation:badgeFade .4s ease;}
@keyframes badgeFade{from{opacity:0;transform:translateY(4px);}to{opacity:.9;transform:translateY(0);}}
@media (max-width:700px){.section-badge{display:none;}}

/* ============================= ROWS (events/projects/courses) ============================= */
.row-list{display:flex;flex-direction:column;}
.row-item{display:grid;grid-template-columns:60px 1fr auto;gap:20px;align-items:center;padding:26px 4px;
  border-top:1px solid var(--border);transition:padding-left .25s ease,border-color .25s ease;position:relative;}
.row-list a.row-item{border-top:1px solid var(--border);}
.row-item:last-child{border-bottom:1px solid var(--border);}
.row-item:hover{padding-left:14px;border-color:var(--border-light);}
.row-item:hover .row-arrow{transform:translateX(4px);opacity:1;}
.row-index{font-family:var(--font-mono);color:var(--text-faint);font-size:13px;}
.row-main .row-type{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--accent-bright);text-transform:uppercase;margin-bottom:6px;}
.row-main h3{font-size:19px;font-weight:500;margin-bottom:4px;}
.row-main .row-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);letter-spacing:.03em;}
.row-arrow{font-family:var(--font-mono);color:var(--text-dim);opacity:.5;transition:all .25s ease;}
@media (max-width:640px){.row-item{grid-template-columns:32px 1fr auto;}.row-main h3{font-size:16px;}}

/* ============================= GRID CARDS (team/blogs/what-we-do) ============================= */
.grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid > *{background:var(--bg);padding:32px;}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.grid-3,.grid-4{grid-template-columns:1fr;}}

.img-placeholder{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;
  background:repeating-linear-gradient(135deg, var(--border) 0 1px, transparent 1px 13px), var(--bg-elevated);
  border:1px solid var(--border);}
.img-placeholder::after{content:'';position:absolute;top:10px;right:10px;width:6px;height:6px;background:var(--accent);}
.img-placeholder.portrait{aspect-ratio:3/4;}
.cover-img{width:100%;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--border);}
.cover-img.portrait{aspect-ratio:3/4;}

.blog-card{border:1px solid var(--border);padding:0;display:flex;flex-direction:column;transition:border-color .25s ease;}
.blog-card:hover{border-color:var(--border-light);}
.blog-card .bc-body{padding:22px;flex:1;display:flex;flex-direction:column;gap:10px;}
.blog-card .bc-meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--accent-bright);text-transform:uppercase;}
.blog-card h3{font-size:18px;}
.blog-card p{color:var(--text-dim);font-size:13.5px;}
.blog-card .bc-foot{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:auto;}

.team-card{text-align:left;}
.team-card h3{font-size:17px;margin-top:16px;}
.team-card .role{font-family:var(--font-mono);font-size:11px;color:var(--accent-bright);letter-spacing:.06em;margin-top:4px;}
.team-card .dept{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;margin-top:8px;}
.team-card p.bio{margin-top:12px;font-size:13px;color:var(--text-dim);}

.wwd-item{padding:32px;}
.wwd-item .wwd-num{font-family:var(--font-mono);color:var(--accent-bright);font-size:12px;margin-bottom:14px;}
.wwd-item h3{font-size:19px;margin-bottom:10px;}
.wwd-item p{color:var(--text-dim);font-size:14px;}

/* ============================= EMPTY STATE ============================= */
.empty-state{border:1px dashed var(--border-light);padding:70px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
.empty-state .eyebrow{margin-bottom:4px;}
.empty-state h3{font-size:24px;text-transform:uppercase;}
.empty-state p{color:var(--text-dim);max-width:420px;font-size:14px;}

/* ============================= FORMS (public contact + admin) ============================= */
.field{margin-bottom:22px;}
.field label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border-light);color:var(--text);
  padding:13px 14px;font-size:14px;border-radius:var(--radius);transition:border-color .2s;
}
.field input::placeholder,.field textarea::placeholder{color:var(--text-faint);}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-bright);outline:none;}
.field textarea{resize:vertical;min-height:100px;font-family:var(--font-body);}
.field textarea.mono-area{font-family:var(--font-mono);font-size:12.5px;}
.field-hint{font-size:11px;color:var(--text-faint);margin-top:6px;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:640px){.form-row-2{grid-template-columns:1fr;}}

/* ============================= PAGE HEADER (interior pages) ============================= */
.page-head{padding:160px 0 70px;border-bottom:1px solid var(--border);}
.page-head h1{font-size:clamp(32px,5.4vw,58px);text-transform:uppercase;margin-top:16px;}
.page-head p{color:var(--text-dim);max-width:520px;margin-top:16px;font-size:15px;}

/* ============================= FOOTER ============================= */
.site-footer{border-top:1px solid var(--border);padding:80px 0 0;margin-top:0;}
.footer-inner{display:grid;grid-template-columns:2fr 1fr 1fr;gap:40px;padding-bottom:56px;}
.footer-col a{display:block;color:var(--text-dim);font-size:13.5px;padding:6px 0;transition:color .2s;}
.footer-col a:hover{color:var(--text);}
.footer-heading{font-size:10.5px;letter-spacing:.12em;color:var(--text-faint);margin-bottom:14px;}
.footer-col p{color:var(--text-dim);font-size:13.5px;max-width:320px;margin:14px 0 20px;}
.footer-bottom{display:flex;justify-content:space-between;padding:22px 0;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;}
@media (max-width:700px){.footer-inner{grid-template-columns:1fr;}.footer-bottom{flex-direction:column;gap:6px;}}

/* ============================= BLOG DETAIL / PROSE ============================= */
.prose{max-width:720px;font-size:16px;line-height:1.8;color:#d8d3c8;}
.prose h1,.prose h2,.prose h3{margin:36px 0 14px;text-transform:none;color:var(--text);}
.prose p{margin-bottom:18px;color:#c8c3b8;}
.prose ul,.prose ol{margin:0 0 18px 22px;color:#c8c3b8;}
.prose li{margin-bottom:6px;}
.prose a{color:var(--accent-bright);text-decoration:underline;text-underline-offset:3px;}
.prose img{border:1px solid var(--border);margin:20px 0;}
.prose code{font-family:var(--font-mono);background:var(--bg-elevated);padding:2px 6px;font-size:.9em;border:1px solid var(--border);}
.prose pre{background:var(--bg-elevated);border:1px solid var(--border);padding:18px;overflow-x:auto;margin:20px 0;}
.prose pre code{border:none;padding:0;}
.prose blockquote{border-left:2px solid var(--accent);padding-left:18px;color:var(--text-dim);margin:20px 0;}

.admin-shell{display:flex;min-height:100vh;padding-top:0;}
.admin-sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg-alt);
  position:sticky;top:0;height:100vh;padding:26px 0;display:flex;flex-direction:column;}
.admin-brand{font-family:var(--font-mono);font-size:12.5px;letter-spacing:.1em;padding:0 24px 22px;border-bottom:1px solid var(--border);}
.admin-brand small{display:block;color:var(--text-faint);font-size:9.5px;margin-top:4px;letter-spacing:.14em;}
.admin-nav{padding:16px 0;flex:1;}
.admin-nav a{display:block;padding:11px 24px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;
  color:var(--text-dim);border-left:2px solid transparent;text-transform:uppercase;}
.admin-nav a:hover{color:var(--text);background:rgba(255,255,255,.02);}
.admin-nav a.active{color:var(--text);border-left-color:var(--accent-bright);background:rgba(255,255,255,.02);}
.admin-nav .divider{margin:14px 24px;}
.admin-foot{padding:16px 24px;border-top:1px solid var(--border);}
.admin-foot .user-email{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-bottom:10px;word-break:break-all;}
.admin-main{flex:1;padding:44px 48px;max-width:1100px;}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px;flex-wrap:wrap;gap:16px;}
.admin-topbar h1{font-size:26px;text-transform:uppercase;}
.admin-form{max-width:680px;}
.form-actions{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.admin-table{width:100%;border-collapse:collapse;border:1px solid var(--border);}
.admin-table th{text-align:left;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text-faint);padding:12px 16px;border-bottom:1px solid var(--border-light);background:var(--bg-alt);}
.admin-table td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--text-dim);}
.admin-table tr:hover td{background:rgba(255,255,255,.015);color:var(--text);}
.admin-row-actions{display:flex;gap:14px;white-space:nowrap;}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:44px;}
.stat-card{background:var(--bg);padding:26px 22px;}
.stat-card .stat-num{font-family:var(--font-display);font-size:38px;color:var(--text);font-weight:300;}
.stat-card .stat-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;margin-top:8px;}
.activity-list{border:1px solid var(--border);}
.activity-row{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-size:13.5px;}
.activity-row:last-child{border-bottom:none;}
.activity-row .act-time{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);}
@media (max-width:1000px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .admin-shell{flex-direction:column;}
  .admin-sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;overflow-x:auto;padding:14px 0;}
  .admin-brand{border-bottom:none;border-right:1px solid var(--border);padding:0 18px;flex-shrink:0;}
  .admin-nav{display:flex;padding:0;}
  .admin-nav a{padding:10px 14px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap;}
  .admin-nav a.active{border-left:none;border-bottom-color:var(--accent-bright);}
  .admin-nav .divider{display:none;}
  .admin-foot{display:none;}
  .admin-main{padding:28px 20px;}
}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:24px;}
.login-box{max-width:400px;width:100%;border:1px solid var(--border-light);background:var(--bg-alt);padding:44px 36px;position:relative;z-index:2;}
.login-box h1{font-size:24px;text-transform:uppercase;margin:12px 0 30px;}
.login-error{color:var(--accent-bright);font-size:12.5px;font-family:var(--font-mono);margin-bottom:16px;min-height:0;}

/* ============================= CALENDAR ============================= */

.calendar-section{
  padding-top:80px;
}

.calendar{
  max-width:900px;
  margin:0 auto;
  border:1px solid var(--border);
  background:var(--bg-alt);
}

.calendar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:26px 30px;
  border-bottom:1px solid var(--border);
}

.calendar-header > div{
  text-align:center;
}

.calendar-month{
  font-family:var(--font-display);
  font-size:24px;
  font-weight:500;
  text-transform:uppercase;
  letter-spacing:.02em;
}

.calendar-year{
  margin-top:4px;
  color:var(--text-faint);
  font-size:10px;
  letter-spacing:.14em;
}

.calendar-nav{
  width:40px;
  height:40px;
  border:1px solid var(--border-light);
  background:transparent;
  color:var(--text-dim);
  font-size:16px;
  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease;
}

.calendar-nav:hover{
  color:var(--text);
  border-color:var(--accent);
  background:var(--accent-dim);
}

.calendar-weekdays,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.calendar-weekdays{
  border-bottom:1px solid var(--border);
}

.calendar-weekdays div{
  padding:14px 10px;
  text-align:center;
  color:var(--text-faint);
  font-size:9px;
  letter-spacing:.1em;
}

.calendar-day{
  min-height:100px;
  padding:12px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  color:var(--text-dim);
  position:relative;
  transition:
    background .2s ease,
    color .2s ease;
}

.calendar-day:nth-child(7n){
  border-right:none;
}

.calendar-day:hover{
  background:rgba(255,255,255,.018);
  color:var(--text);
}

.calendar-day.empty{
  background:rgba(255,255,255,.008);
}

.calendar-number{
  font-family:var(--font-mono);
  font-size:11px;
}

.calendar-day.today .calendar-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  background:var(--accent);
  color:#fff;
}

.calendar-empty{
  max-width:900px;
  margin:48px auto 0;
  padding:30px 0;
  border-top:1px solid var(--border);
}

.calendar-empty h3{
  margin-top:12px;
  font-size:20px;
}

.calendar-empty p{
  margin-top:8px;
  color:var(--text-dim);
  font-size:14px;
}

@media(max-width:700px){

  .calendar-header{
    padding:20px;
  }

  .calendar-month{
    font-size:20px;
  }

  .calendar-day{
    min-height:70px;
    padding:8px;
  }

  .calendar-weekdays div{
    padding:10px 4px;
    font-size:8px;
  }

}

const store = {
  async get(key, shared = true){
    try{
      const r = await window.storage.get(key, shared);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared = true){
    try{ await window.storage.set(key, JSON.stringify(value), shared); return true; }
    catch(e){ console.error('storage.set failed', e); return false; }
  },
  async remove(key, shared = true){
    try{ await window.storage.delete(key, shared); return true; }
    catch(e){ return false; }
  }
};

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  if(isNaN(d.getTime())) return esc(ts);
  return d.toLocaleDateString('en-US',{ day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}
function showToast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast mono';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function makeCollectionService(key){
  return {
    async getAll(){ return (await store.get(key)) || []; },
    async getPublished(){ return (await this.getAll()).filter(i => i.status === 'published'); },
    async getById(id){ return (await this.getAll()).find(i => i.id === id) || null; },
    async create(data){
      const list = await this.getAll();
      const item = { ...data, id: uid(), status: data.status || 'draft', createdAt: Date.now(), updatedAt: Date.now() };
      list.unshift(item);
      await store.set(key, list);
      return item;
    },
    async update(id, patch){
      const list = await this.getAll();
      const idx = list.findIndex(i => i.id === id);
      if(idx === -1) return null;
      list[idx] = { ...list[idx], ...patch, updatedAt: Date.now() };
      await store.set(key, list);
      return list[idx];
    },
    async delete(id){
      const list = (await this.getAll()).filter(i => i.id !== id);
      await store.set(key, list);
      return true;
    }
  };
}
function makeSingletonService(key, defaults){
  return {
    async get(){ const v = await store.get(key); return v || defaults; },
    async update(patch){
      const current = await this.get();
      const merged = { ...current, ...patch };
      await store.set(key, merged);
      return merged;
    }
  };
}

function compilePattern(pattern){
  const paramNames = [];
  const regexStr = '^' + pattern.replace(/:[^/]+/g, m => { paramNames.push(m.slice(1)); return '([^/]+)'; }) + '$';
  return { regex: new RegExp(regexStr), paramNames };
}
const routes = [
  { path:'/', view: HomePage },

  { path:'/blogs', view: BlogsPage },

  { path:'/admin/dashboard', view: AdminDashboardPage, admin:true, key:'dashboard' },
  { path:'/admin/homepage', view: AdminHomepagePage, after: bindHomepageForm, admin:true, key:'homepage' },
  { path:'/admin/about', view: AdminAboutPage, after: bindAboutForm, admin:true, key:'about' },
  { path:'/admin/contact', view: AdminContactPage, after: bindContactForm, admin:true, key:'contact' },
  ...Object.keys(resourceConfigs).flatMap(rk => ([
    { path:`/admin/${rk}`, view: () => AdminResourceListPage(rk), admin:true, key:rk },
    { path:`/admin/${rk}/new`, view: () => AdminResourceEditorPage(rk, null), after: () => bindResourceEditor(rk, null), admin:true, key:rk },
    { path:`/admin/${rk}/edit/:id`, view: p => AdminResourceEditorPage(rk, p.id), after: p => bindResourceEditor(rk, p.id), admin:true, key:rk },
  ]))
];
routes.forEach(r => Object.assign(r, compilePattern(r.path)));

function parseHash(){
  let h = location.hash.slice(1);
  if(!h) h = '/';
  if(h.length > 1 && h.endsWith('/')) h = h.slice(0, -1);
  return h;
}
function matchRoute(path){
  for(const route of routes){
    const m = path.match(route.regex);
    if(m){
      const params = {};
      route.paramNames.forEach((name,i) => params[name] = decodeURIComponent(m[i+1]));
      return { route, params };
    }
  }
  return null;
}
let calendarDate = new Date();

function initCalendar(){

  const monthEl = document.getElementById('calendar-month');
  const yearEl = document.getElementById('calendar-year');
  const gridEl = document.getElementById('calendar-grid');
  const selectedDateEl =
  document.getElementById('selected-date');

const selectedMessageEl =
  document.getElementById('selected-date-message');
  const prevBtn = document.getElementById('calendar-prev');
  const nextBtn = document.getElementById('calendar-next');

  if(!monthEl || !yearEl || !gridEl) return;

  function renderCalendar(){

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    const monthName = calendarDate.toLocaleString('en-US', {
      month:'long'
    });

    monthEl.textContent = monthName;
    yearEl.textContent = year;

    gridEl.innerHTML = '';

    const firstDay = new Date(year, month, 1);

    // Convert Sunday=0 into Monday=0
    const startingDay = (firstDay.getDay() + 6) % 7;

    const daysInMonth = new Date(
      year,
      month + 1,
      0
    ).getDate();

    // Empty cells before the first day
    for(let i = 0; i < startingDay; i++){

      const empty = document.createElement('div');

      empty.className = 'calendar-day empty';

      gridEl.appendChild(empty);
    }

    // Actual days
    const today = new Date();

    for(let day = 1; day <= daysInMonth; day++){

      const cell = document.createElement('div');

      cell.className = 'calendar-day';
      cell.addEventListener('click', () => {

  document
    .querySelectorAll('.calendar-day.selected')
    .forEach(dayCell => {
      dayCell.classList.remove('selected');
    });

  cell.classList.add('selected');

  const selectedDate =
    new Date(year, month, day);

  const formattedDate =
    selectedDate.toLocaleDateString('en-US', {
      weekday: 'long',
      month: 'long',
      day: 'numeric',
      year: 'numeric'
    });

  selectedDateEl.textContent =
    formattedDate;

  const selectedEvents =
  CLUB_EVENTS.filter(
    event => event.date ===
      `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`
  );

if(selectedEvents.length === 0){

  selectedMessageEl.textContent =
    'No events scheduled for this date.';

}else{

  selectedMessageEl.innerHTML =
    selectedEvents.map(event => `
      <div class="selected-event">

        <div class="selected-event-title">
          ${event.title}
        </div>

        <div class="selected-event-meta mono">
          ${event.time || ''}
          ${event.venue ? ` · ${event.venue}` : ''}
        </div>

        ${
          event.description
            ? `<div class="selected-event-description">
                ${event.description}
              </div>`
            : ''
        }

      </div>
    `).join('');
}
});
      const isToday =
        day === today.getDate() &&
        month === today.getMonth() &&
        year === today.getFullYear();

      if(isToday){
        cell.classList.add('today');
      }

      const dateKey =
  `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

const dayEvents = CLUB_EVENTS.filter(
  event => event.date === dateKey
);
cell.innerHTML = `
  <div class="calendar-number">
    ${day}
  </div>

  ${
    dayEvents.length
      ? `<div class="calendar-event-dot"></div>`
      : ''
  }


  <div class="calendar-events">
    ${dayEvents.map(event => `
      <div class="calendar-event">
        ${event.title}
      </div>
    `).join('')}
  </div>
`;

      gridEl.appendChild(cell);
    }
  }

  prevBtn.addEventListener('click', () => {

    calendarDate.setMonth(
      calendarDate.getMonth() - 1
    );

    renderCalendar();

  });

  nextBtn.addEventListener('click', () => {

    calendarDate.setMonth(
      calendarDate.getMonth() + 1
    );

    renderCalendar();

  });

  renderCalendar();
}
async function render(){
  const path = parseHash();
  const found = matchRoute(path);
  const app = document.getElementById('app');
  if(!found){ app.innerHTML = `<div class="page-fade">${NotFoundPage()}</div>`; return; }
  const { route, params } = found;
  if(route.admin && !route.skipGuard){
    const authed = await authService.isAuthenticated();
    if(!authed){ location.hash = '#/admin/login'; return; }
  }
  app.innerHTML = '<div class="page-loading mono">LOADING…</div>';
  let html;
  try{ html = await route.view(params); }
  catch(e){ console.error(e); html = NotFoundPage(); }
  app.innerHTML = `<div class="page-fade">${html}</div>`;
  window.scrollTo(0,0);
  if(route.after) route.after(params);
  initGlobalWidgets(path);
  if(path === '/events'){
  initCalendar();
}
}
window.addEventListener('hashchange', render);

      ${!cfg.noStatus ? `<button data-action="toggle-status" data-id="${it.id}" data-resource="${resourceKey}" class="link-btn mono">${it[statusKey]==='published'?'UNPUBLISH':'PUBLISH'}</button>` : ''}

  return adminShell(`

      <a href="#/admin/${resourceKey}/new" class="btn btn-primary">+ New ${cfg.singular}</a>

function renderField(f, value){
  const val = value ?? '';
  const req = f.required ? 'required' : '';
  if(f.type === 'textarea'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${f.key}" ${req} placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea></div>`;
  }
  if(f.type === 'markdown'){
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><textarea name="${f.key}" ${req} rows="12" class="mono-area" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>${f.hint?`<div class="field-hint">${esc(f.hint)}</div>`:''}</div>`;
  }
  if(f.type === 'select'){
    return `<div class="field"><label>${esc(f.label)}</label><select name="${f.key}">
      ${f.options.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}
    </select></div>`;
  }
  if(f.type === 'date'){
    return `<div class="field"><label>${esc(f.label)}</label><input type="date" name="${f.key}" value="${esc(val)}" ${req}></div>`;
  }
  return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input type="text" name="${f.key}" value="${esc(val)}" ${req} placeholder="${esc(f.placeholder||'')}"></div>`;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  if(action === 'mobile-menu-toggle'){
    document.getElementById('site-nav')?.classList.toggle('nav-open');
    return;
  }
  if(action === 'logout'){
    await authService.logout();
    location.hash = '#/admin/login';
    return;
  }
  const resourceKey = btn.dataset.resource;
  const id = btn.dataset.id;
  if(action === 'delete'){
    if(!confirm('Delete this item? This cannot be undone.')) return;
    await resourceConfigs[resourceKey].service.delete(id);
    showToast('Deleted.');
    render();
  } else if(action === 'toggle-status'){
    const cfg = resourceConfigs[resourceKey];
    const statusKey = cfg.statusField || 'status';
    const item = await cfg.service.getById(id);
    const next = item[statusKey] === 'published' ? 'draft' : 'published';
    await cfg.service.update(id, { [statusKey]: next });
    showToast(next === 'published' ? 'Published.' : 'Unpublished.');
    render();
  }
});

const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function initNetworkCanvas(canvas){
  const ctx = canvas.getContext('2d');
  let w,h,nodes,raf;
  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();
    w = canvas.width = rect.width * devicePixelRatio;
    h = canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
  }
  function makeNodes(){
    const count = Math.max(24, Math.floor((w*h) / (55000 * devicePixelRatio * devicePixelRatio)));
    nodes = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h,
      vx: (Math.random()-0.5)*0.15*devicePixelRatio, vy: (Math.random()-0.5)*0.15*devicePixelRatio,
      accent: Math.random() < 0.08
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const maxDist = 150 * devicePixelRatio;
    for(let i=0;i<nodes.length;i++){
      const n = nodes[i];
      if(!REDUCED_MOTION){ n.x += n.vx; n.y += n.vy; }
      if(n.x < 0 || n.x > w) n.vx *= -1;
      if(n.y < 0 || n.y > h) n.vy *= -1;
      for(let j=i+1;j<nodes.length;j++){
        const o = nodes[j];
        const dx = n.x-o.x, dy = n.y-o.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < maxDist){
          ctx.strokeStyle = `rgba(140,138,130,${(1-dist/maxDist)*0.18})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(o.x,o.y); ctx.stroke();
        }
      }
    }
    for(const n of nodes){
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.accent ? 2.4*devicePixelRatio : 1.6*devicePixelRatio, 0, Math.PI*2);
      ctx.fillStyle = n.accent ? 'rgba(165,49,66,0.85)' : 'rgba(230,225,215,0.45)';
      ctx.fill();
    }
    if(!REDUCED_MOTION) raf = requestAnimationFrame(draw);
  }
  resize(); makeNodes(); draw();
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); resize(); makeNodes(); draw(); }, { once:false });
}
function initAsciiCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const chars = [' ','.',':','+','=','#'];

  let cols, rows, cellW, cellH, grid, w, h, timer;

  function resize(){
    const rect = canvas.parentElement.getBoundingClientRect();

    w = canvas.width = rect.width * devicePixelRatio;
    h = canvas.height = rect.height * devicePixelRatio;

    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';

    cellW = 7 * devicePixelRatio;
    cellH = 16 * devicePixelRatio;

    cols = Math.floor(w / cellW);
    rows = Math.floor(h / cellH);

    buildGrid();
  }

  function noise(x, y, seed){
    return Math.sin(x * 0.18 + seed) *
           Math.cos(y * 0.22 - seed) +
           Math.sin((x + y) * 0.09 + seed * 1.7);
  }

  function buildGrid(){
    grid = [];

    const cx1 = cols * 0.32;
    const cy1 = rows * 0.38;

    const cx2 = cols * 0.68;
    const cy2 = rows * 0.30;

    for(let y = 0; y < rows; y++){

      const row = [];

      for(let x = 0; x < cols; x++){

        let v = noise(x, y, 1.3);

        const d1 =
          Math.hypot(
            x - cx1,
            (y - cy1) * 1.6
          ) / (cols * 0.32);

        const d2 =
          Math.hypot(
            x - cx2,
            (y - cy2) * 1.6
          ) / (cols * 0.28);

        v +=
          (1 - Math.min(d1, 1)) * 1.6 +
          (1 - Math.min(d2, 1)) * 1.2;

        let density = (v + 2.2) / 4.6;

        if(y > rows * 0.82){
          density =
            0.55 + ((x + y) % 3) * 0.15;
        }

        density =
          Math.max(0, Math.min(1, density));

        const level =
          Math.min(
            chars.length - 1,
            Math.floor(density * chars.length)
          );

        row.push({
          level,
          accent:
            Math.random() < 0.015 &&
            level > 1
        });
      }

      grid.push(row);
    }
  }

  function draw(){

    ctx.clearRect(0, 0, w, h);

    ctx.font =
      `${11 * devicePixelRatio}px 'JetBrains Mono', monospace`;

    ctx.textBaseline = 'top';

    for(let y = 0; y < rows; y++){

      for(let x = 0; x < cols; x++){

        const cell = grid[y][x];
        const ch = chars[cell.level];

        if(ch === ' ') continue;

        ctx.fillStyle =
          cell.accent
            ? 'rgba(165,49,66,0.75)'
            : `rgba(220,215,205,${0.12 + cell.level * 0.13})`;

        ctx.fillText(
          ch,
          x * cellW,
          y * cellH
        );
      }
    }
  }

  function flicker(){

    if(REDUCED_MOTION || !grid) return;

    const n =
      Math.floor(cols * rows * 0.01);

    for(let i = 0; i < n; i++){

      const x =
        Math.floor(Math.random() * cols);

      const y =
        Math.floor(Math.random() * rows);

      if(grid[y] && grid[y][x]){

        grid[y][x].level =
          Math.max(
            0,
            Math.min(
              chars.length - 1,
              grid[y][x].level +
                (Math.random() < 0.5 ? -1 : 1)
            )
          );
      }
    }

    draw();
  }

  resize();
  draw();

  clearInterval(timer);

  if(!REDUCED_MOTION){
    timer = setInterval(flicker, 550);
  }

  window.addEventListener(
    'resize',
    () => {
      resize();
      draw();
    }
  );
}

function initScrollSpy(){
  const badge = document.getElementById('section-badge');
  if(!badge) return;
  const sections = document.querySelectorAll('[data-section-index]');
  if(!sections.length) return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const idx = entry.target.dataset.sectionIndex;
        const label = entry.target.dataset.sectionLabel;
        if(badge.dataset.current !== idx){
          badge.dataset.current = idx;
          badge.classList.remove('fade'); void badge.offsetWidth; badge.classList.add('fade');
          badge.querySelector('.num').textContent = idx;
          badge.querySelector('.lbl').textContent = label;
        }
      }
    });
  }, { threshold: 0.45 });
  sections.forEach(s => io.observe(s));
}
